[package]
name = "lig"
version = "0.1.0"
edition = "2024"
description = "Fig-style IDE autocomplete for your Linux terminal, powered by the withfig completion specs"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
flate2 = "1.1.10"
libc = "0.2.190"
nix = { version = "0.31.3", features = ["term", "ioctl", "signal", "process", "fs"] }
portable-pty = "0.9.0"
rquickjs = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
tar = "0.4.46"
toml = "1.1.8"
unicode-width = "0.2.2"
ureq = "3.4.2"
vt100 = "0.16.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
