<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Lig</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Terminal tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shine)"/>

  <!-- Prompt: ❯ and the word being typed, then the cursor -->
  <polyline points="92,100 124,128 92,156" fill="none" stroke="#6ee7b7" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="152" y="116" width="92" height="24" rx="12" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="258" y="102" width="16" height="52" rx="5" fill="#6ee7b7"/>

  <!-- Suggestion popup, aligned with the word being completed -->
  <g filter="url(#shadow)">
    <rect x="136" y="186" width="300" height="228" rx="34" fill="#ffffff"/>
  </g>
  <!-- Selected suggestion -->
  <rect x="150" y="200" width="272" height="64" rx="22" fill="#7c3aed"/>
  <rect x="170" y="220" width="24" height="24" rx="7" fill="#c4b5fd"/>
  <rect x="210" y="225" width="122" height="14" rx="7" fill="#ffffff"/>
  <rect x="348" y="225" width="54" height="14" rx="7" fill="#ffffff" fill-opacity="0.55"/>
  <!-- Other suggestions -->
  <rect x="170" y="284" width="24" height="24" rx="7" fill="#10b981"/>
  <rect x="210" y="289" width="100" height="14" rx="7" fill="#4b5563"/>
  <rect x="326" y="289" width="72" height="14" rx="7" fill="#d1d5db"/>
  <rect x="170" y="348" width="24" height="24" rx="7" fill="#f59e0b"/>
  <rect x="210" y="353" width="134" height="14" rx="7" fill="#4b5563"/>
  <rect x="360" y="353" width="40" height="14" rx="7" fill="#d1d5db"/>
</svg>
